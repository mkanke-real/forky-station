- type: entity
  id: SharpsBin
  parent: [ BaseWallmount ,BaseStorageItem, BaseBagOpenClose ]
  name: sharps bin
  description: Dispose of those needles in their appropriate place. Safely mounted to a wall.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Specific/Medical/sharpsbin.rsi
    layers:
    - state: closed
      map: [ "closeLayer" ]
    - state: open
      map: [ "openLayer" ]
  - type: Appearance
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 250
        layer:
        - TableLayer
        mask:
        - TableMask
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,4
    whitelist:
      tags:
      - SharpsTrash
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 0
            max: 1
  - type: StaticPrice
    price: 500
  - type: DnaSubstanceTrace
  - type: Construction
    graph: SharpsBinGraph
    node: bin
