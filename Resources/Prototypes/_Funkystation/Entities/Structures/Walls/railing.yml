- type: entity
  abstract: true
  parent: [ BaseStructure, StructureHealthBarrierWeak ]
  id: BaseRailingFunky
  name: railing
  description: Basic railing meant to protect idiots like you from falling.
  placementMode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: Structures/Walls/railing.rsi
  - type: Icon
    sprite: Structures/Walls/railing.rsi
  - type: Physics
    bodyType: Static
  - type: InteractionOutline
  - type: Climbable

- type: entity
  parent: BaseRailingFunky
  id: WoodRailing
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Funkystation/Structures/Walls/wood_railing.rsi
    state: side
    offset: 0, -0.5
  - type: Icon
    sprite: _Funkystation/Structures/Walls/wood_railing.rsi
    state: side
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 0
            max: 1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-1.49,0.49,-1.40"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer
